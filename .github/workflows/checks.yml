name: Shared quality checks
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact checked commit
        env:
          CHECKED_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.1.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:local
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-reports
          path: |
            .check-reports/
            playwright-report/
            test-results/
          include-hidden-files: true
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact checked commit
        env:
          CHECKED_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.1.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Report development dependency vulnerabilities
        run: pnpm audit --dev
        continue-on-error: true
