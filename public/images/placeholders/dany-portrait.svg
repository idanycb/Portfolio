<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Portrait placeholder</title>
  <desc id="desc">A neutral dotted placeholder for Daniel Thomas Jesudoss's grayscale portrait.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.6" fill="#96918a" />
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#e6e2da" />
  <rect width="800" height="1000" fill="url(#dots)" />
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#111111" stroke-width="3" />
  <text x="400" y="490" fill="#111111" font-family="monospace" font-size="22" text-anchor="middle" letter-spacing="4">PORTRAIT PLACEHOLDER</text>
  <text x="400" y="530" fill="#4a463f" font-family="monospace" font-size="16" text-anchor="middle" letter-spacing="3">800 × 1000 · 4:5</text>
</svg>
